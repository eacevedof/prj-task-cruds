# api
server {
  listen       80;
  server_name _;

  # solo public/ es navegable; el compose ademas solo monta public/ en este contenedor
  root /app/public;
  index index.php;
  autoindex off;
  server_tokens off;

  # ficheros ocultos (.env, .git, .htaccess...) nunca, aunque acaben dentro de public/
  location ~ /\. {
    return 404;
  }

  location / {
    try_files $uri @rewriteapp;
  }

  location @rewriteapp {
    rewrite ^(.*)$ /index.php/$1 last;
  }

  location ~ ^/index\.php(/|$) {
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    fastcgi_pass task-php-fpm:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS off;
  }

  # cualquier otro .php no se ejecuta
  location ~ \.php$ {
    return 404;
  }

  error_log /var/log/nginx/task-php-error.log;
  access_log /var/log/nginx/task-php-access.log main;
}
