# docker/docker-compose.yml -- SPA estatica (html + js modules) servida por nginx alpine. Sin build: ES modules.
# Lanzar desde task-js/ con el makefile (make up). Variables opcionales en docker/.env (ver .env.example).
name: task-js

services:
  task-js-web:
    container_name: cont-task-js-web
    image: nginx:1.30-alpine
    environment:
      TZ: ${TIME_ZONE:-UTC}
      # el entrypoint de nginx sustituye las variables en /etc/nginx/templates/*.template al arrancar
      # APIs que se pueden elegir desde la interfaz (selector de back)
      API_BASE_URL_PHP: ${API_BASE_URL_PHP:-http://localhost:9100}
      API_BASE_URL_GO: ${API_BASE_URL_GO:-http://localhost:9300}
      API_BASE_URL_RUST: ${API_BASE_URL_RUST:-http://localhost:9500}
    ports:
      - ${HTTP_PORT:-9200}:80
    volumes:
      # solo public/ y en lectura: nginx no puede servir nada mas del proyecto
      - ../public:/usr/share/nginx/html:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
