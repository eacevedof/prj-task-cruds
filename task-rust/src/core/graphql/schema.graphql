# POST /graphql -- unica API de la app junto al login REST (src/core/routes/routes.rs). Claves en snake_case.
# Un error de dominio llega en errors[] con extensions.code = el codigo HTTP equivalente y
# extensions.errors = el detalle por campo.
# Auth: "Authorization: Bearer <api_token>" en todo salvo createUser (alta abierta) y logIn. Cada token solo ve y
# modifica su propio usuario y sus tasks; lo ajeno responde 404 como si no existiera.
# task_status / task_type van como String: los valores permitidos (TaskStatusEnum / TaskTypeEnum) los valida
# el dominio, asi no se repiten aqui.
# Listados de tasks (tasks, userTasks, User.tasks): paginados y filtrables, la mas reciente primero (id desc).
# page empieza en 1; page_size entre 1 y 100 (20 por defecto).

type Query {
    users: [User!]!
    user(user_uuid: ID!): User
    tasks(filter: TasksFilter, page: Int = 1, page_size: Int = 20): TaskPage
    task(task_uuid: ID!): Task
    userTasks(user_uuid: ID!, filter: TasksFilter, page: Int = 1, page_size: Int = 20): TaskPage
}

type Mutation {
    "user_name: login unico, 3-50 de letras, digitos, punto, guion bajo y guion. password: 8-72"
    createUser(user_name: String!, user_email: String!, password: String!): User
    "devuelve el usuario con un api_token nuevo: el anterior deja de valer"
    logIn(user_name: String!, password: String!): User
    updateUser(user_uuid: ID!, user_name: String!, user_email: String!): User
    deleteUser(user_uuid: ID!): DeleteUserResult
    regenerateApiToken(user_uuid: ID!): ApiTokenResult

    createTask(
        task_title: String!
        task_status: String
        task_type: String
        target_date: String
        task_description: String
    ): Task
    updateTask(
        task_uuid: ID!
        task_title: String!
        task_status: String
        task_type: String
        target_date: String
        task_description: String
    ): Task
    deleteTask(task_uuid: ID!): DeleteTaskResult
}

type User {
    user_uuid: ID!
    user_name: String!
    user_email: String!
    created_at: String!
    updated_at: String!
    tasks(filter: TasksFilter, page: Int = 1, page_size: Int = 20): TaskPage
    "solo en createUser y logIn: el token en claro se devuelve una unica vez"
    api_token: String
}

type Task {
    "id numerico, solo informativo: para operar se usa task_uuid"
    task_id: Int!
    task_uuid: ID!
    user_uuid: ID!
    task_title: String!
    task_status: String!
    task_type: String!
    target_date: String
    task_description: String
    created_at: String!
    updated_at: String!
}

"""
Filtros de los listados de tasks; los que no vienen (o vacios) no filtran.
task_text: contenido en titulo o descripcion, sin distinguir mayusculas.
target_date_from / target_date_to: YYYY-MM-DD, ambos incluidos (una task sin target_date no entra).
"""
input TasksFilter {
    task_text: String
    task_status: String
    task_type: String
    target_date_from: String
    target_date_to: String
}

"Una pagina de tasks (id desc)"
type TaskPage {
    items: [Task!]!
    page: Int!
    page_size: Int!
    total_items: Int!
    total_pages: Int!
}

type DeleteUserResult {
    user_uuid: ID!
    affected: Int!
}

type ApiTokenResult {
    user_uuid: ID!
    api_token: String!
}

type DeleteTaskResult {
    task_uuid: ID!
    affected: Int!
}
